---
- name: Create and Configure Loopback Interface on Network Devices
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  pre_tasks:
    - name: Ensure ~/.ssh directory exists in AWX Execution Environment
      ansible.builtin.file:
        path: "~/.ssh"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Configure legacy SSH algorithms for Cisco IOS 15.7 compatibility
      ansible.builtin.copy:
        dest: "~/.ssh/config"
        mode: "0600"
        content: |
          Host *
            KexAlgorithms +diffie-hellman-group14-sha1
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

  tasks:
  # --- CISCO IOS TASKS ---
    - name: Configure Cisco IOS Loopback description and status
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: true
        state: merged
      loop: "{{ loopback_interfaces }}"
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Configure Cisco IOS Loopback IPv4 address
      cisco.ios.ios_l3_interfaces:
        config:
          - name: "{{ item.name }}"
            ipv4:
              - address: "{{ item.ipv4 }}"
        state: merged
      loop: "{{ loopback_interfaces }}"
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Save configuration on Cisco IOS devices
      cisco.ios.ios_config:
        save_when: modified
      when: ansible_network_os == 'cisco.ios.ios'
      
  # --- JUNIPER JUNOS TASKS ---
    - name: Configure Juniper JUNOS Loopback description and status
      juniper.device.junos_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: true
        state: merged
      loop: "{{ loopback_interfaces }}"
      when: ansible_network_os == 'juniper.device.junos'

    - name: Configure Juniper JUNOS Loopback IPv4 address
      juniper.device.junos_l3_interfaces:
        config:
          - name: "{{ item.name }}"
            unit: "{{ item.unit }}"
            ipv4:
              - address: "{{ item.ipv4 }}"
        state: merged
      loop: "{{ loopback_interfaces }}"
      when: ansible_network_os == 'juniper.device.junos'