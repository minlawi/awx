---
- name: Create and Configure Loopback Interface on Network Devices
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  pre_tasks:
    - name: Ensure ~/.ssh directory exists in AWX Execution Environment
      ansible.builtin.file:
        path: "~/.ssh"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Configure legacy SSH algorithms for Cisco IOS 15.7 compatibility
      ansible.builtin.copy:
        dest: "~/.ssh/config"
        mode: "0600"
        content: |
          Host *
            KexAlgorithms +diffie-hellman-group14-sha1
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
    - name: Configure Cisco IOS Loopback description and status
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: true
        state: merged
      loop: "{{ loopback_interfaces }}"
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Configure Cisco IOS Loopback IPv4 address
      cisco.ios.ios_l3_interfaces:
        config:
          - name: "{{ item.name }}"
            ipv4:
              - address: "{{ item.ipv4 }}"
        state: merged
      loop: "{{ loopback_interfaces }}"
      when: ansible_network_os == 'cisco.ios.ios'