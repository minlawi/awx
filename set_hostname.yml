---
- name: Configure Dynamic Device Hostname
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  pre_tasks:
    - name: Ensure ~/.ssh directory exists in AWX Execution Environment
      ansible.builtin.file:
        path: "~/.ssh"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Configure legacy SSH algorithms for Cisco IOS 15.7 compatibility
      ansible.builtin.copy:
        dest: "~/.ssh/config"
        mode: "0600"
        content: |
          Host *
            KexAlgorithms +diffie-hellman-group14-sha1
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
      delegate_to: localhost
      become: false
      run_once: true

  tasks:
  # --- CISCO IOS TASKS ---
    - name: Set hostname on Cisco IOS devices
      cisco.ios.ios_hostname:
        config:
          hostname: "{{ router_hostname }}"
        state: merged
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Save configuration on Cisco IOS devices
      cisco.ios.ios_config:
        save_when: modified
      when: ansible_network_os == 'cisco.ios.ios'

  # --- JUNIPER JUNOS TASKS ---
    - name: Set hostname on Juniper JUNOS devices
      junipernetworks.junos.junos_hostname:
        config:
          hostname: "{{ router_hostname }}"
        state: merged
      when: ansible_network_os == 'junipernetworks.junos.junos'

    - name: Save configuration on Juniper JUNOS devices
      junipernetworks.junos.junos_config:
        save_when: modified
      when: ansible_network_os == 'junipernetworks.junos.junos'