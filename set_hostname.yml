---
- name: Configure Router Hostname
  hosts: routers
  gather_facts: false

  pre_tasks:
    - name: Ensure .ssh directory exists in container HOME
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Write legacy SSH KEX and HostKey config for libssh
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'HOME') }}/.ssh/config"
        mode: '0600'
        content: |
          Host *
              KexAlgorithms +diffie-hellman-group14-sha1
              HostKeyAlgorithms +ssh-rsa
              PubkeyAcceptedAlgorithms +ssh-rsa
      delegate_to: localhost
      become: false

  tasks:
    - name: Merged the hostname configuration on the router
      cisco.ios.ios_hostname:
        config:
          hostname: router-awx
        state: merged

    - name: Create Loopback1 interface
      cisco.ios.ios_interfaces:
        config:
          - name: Loopback1
            description: Router ID Loopback created by Ansible AWX
            enabled: true
        state: merged

    - name: Assign IPv4 address to Loopback1 interface
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Loopback1
            ipv4:
              - address: 10.255.255.1/32
        state: merged

        