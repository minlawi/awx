---
- name: Configure Cisco IOS Router Hostname
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Ensure ~/.ssh directory exists in AWX Execution Environment
      ansible.builtin.file:
        path: "~/.ssh"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Configure legacy SSH algorithms for Cisco IOS 15.7 compatibility
      ansible.builtin.copy:
        dest: "~/.ssh/config"
        mode: "0600"
        content: |
          Host *
            KexAlgorithms +diffie-hellman-group14-sha1
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
      delegate_to: localhost
      become: false

  tasks:
    - name: Set router hostname
      cisco.ios.ios_hostname:
        config:
          hostname: router-awx
        state: merged