name: Trigger AWX on Modified Playbook or Inventory

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - playbook: set_hostname.yml
            template_id: 12
          - playbook: create_loopback.yml
            template_id: 13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check git diff and trigger AWX Job Template
        env:
          AWX_URL: ${{ secrets.AWX_BASE_URL }}
          AWX_TOKEN: ${{ secrets.AWX_API_TOKEN }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files in latest commit:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE "^(${{ matrix.playbook }}|inventory/)"; then
            echo "Change detected — launching Template ID ${{ matrix.template_id }}..."
            curl -f -s -S -X POST "$AWX_URL/api/v2/job_templates/${{ matrix.template_id }}/launch/" \
              -H "Authorization: Bearer $AWX_TOKEN" \
              -H "Content-Type: application/json"
          else
            echo "No relevant changes for ${{ matrix.playbook }} — skipping."
          fi