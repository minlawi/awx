# 1. Add variables here
# 2. Create a new playbook + AWX Job Template
# 3. Add playbook & template_id to '.github/workflows/trigger-awx.yml'

router_hostname: JR1-CORE-SG

loopback_interfaces:
  - name: lo0
    unit: 0
    description: Management-Loopback
    ipv4: 10.255.10.3/32
  - name: lo1
    unit: 0
    description: BGP-Peering-Loopback
    ipv4: 10.255.20.3/32